<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <title>BRASPER</title>
    <defs>
        <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0A1A4D" />
            <stop offset="1" stop-color="#060C24" />
        </linearGradient>
        <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="720" y2="0">
            <stop offset="0" stop-color="#1A5CFF" />
            <stop offset="1" stop-color="#00D5FF" />
        </linearGradient>
        <linearGradient id="bottom" gradientUnits="userSpaceOnUse" x1="762" y1="0" x2="304" y2="0">
            <stop offset="0" stop-color="#5B8BFF" />
            <stop offset="1" stop-color="#1A5CFF" />
        </linearGradient>
    </defs>
    <!-- Two arrows trading places: an exchange, Brazil ⇄ Peru. -->
    <rect width="1024" height="1024" fill="url(#ground)" />
    <g id="mark" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M262 392 H700" stroke="url(#top)" stroke-width="84" />
        <path d="M600 292 L720 392 L600 492" stroke="url(#top)" stroke-width="84" />
        <path d="M762 632 H324" stroke="url(#bottom)" stroke-width="84" />
        <path d="M424 532 L304 632 L424 732" stroke="url(#bottom)" stroke-width="84" />
    </g>
</svg>
